<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gift preview</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chewy&family=Patrick+Hand+SC&family=Poppins:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Same screens as the real site (index.html). The online Gift Studio
       sends the gift in with postMessage, then app.js runs. -->
  <main id="app">
    <section class="screen screen--checker" id="landing" aria-label="Snoopy has a gift">
      <div class="stage">
        <img class="hero-img" src="assets/snoopy-gift.webp" alt="Snoopy in a party hat sitting with a wrapped gift and Woodstock">
        <div class="landing-slot">
          <p class="hand caption" data-text="landing.caption"></p>
          <div class="choices">
            <button class="pill" data-go="birthday" data-text="landing.accept"></button>
            <button class="pill" data-go="decline" data-text="landing.decline"></button>
          </div>
        </div>
      </div>
    </section>
    <section class="screen screen--checker" id="decline" aria-label="Are you sure?">
      <div class="stage">
        <img class="hero-img hero-img--cry" src="assets/snoopy-cry.webp" alt="Snoopy crying">
        <p class="hand caption is-in" data-text="decline.title"></p>
        <button class="pill is-in" data-go="landing" data-text="decline.back"></button>
      </div>
    </section>
    <section class="screen screen--confetti" id="birthday" aria-label="Happy birthday">
      <div class="confetti" aria-hidden="true"></div>
      <div class="stage">
        <h1 class="hand title-hand" id="birthday-title"></h1>
        <img class="hero-img hero-img--party" src="assets/snoopy-party.webp" alt="Snoopy and Woodstock in party hats">
        <button class="pill pill--small" data-go="hub" data-text="birthday.button"></button>
      </div>
    </section>
    <section class="screen screen--dots" id="hub" aria-label="Gifts for you">
      <div class="stage">
        <h2 class="chewy hub-title" data-text="hub.title"></h2>
        <p class="sub" data-text="hub.subtitle"></p>
        <div class="tiles" id="tiles"></div>
      </div>
    </section>
    <section class="screen screen--peri" id="gift" aria-label="Your gift">
      <div class="gift-wrap">
        <div class="card" id="gift-card"></div>
        <button class="back-bar chewy" data-go="hub" data-text="back"></button>
      </div>
    </section>
  </main>
  <script>
    (function () {
      var started = false;
      window.addEventListener("message", function (e) {
        var d = e.data;
        if (started || !d || d.type !== "snoopy-gift" || !d.gift) return;
        started = true;
        window.GIFT = d.gift;
        var s = document.createElement("script");
        s.src = "app.js";
        document.body.appendChild(s);
      });
      // tell the studio we're ready for the gift
      if (window.parent !== window) window.parent.postMessage({ type: "snoopy-preview-ready" }, "*");
    })();
  </script>
</body>
</html>
